name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Full lint / type check / test matrix. Nothing is published unless this passes.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the tag, so it needs the
          # full history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Check built version matches the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          ls -1 dist/
          if [ ! -f "dist/hdmimatrix-${tag_version}.tar.gz" ] || \
             [ ! -f "dist/hdmimatrix-${tag_version}-py3-none-any.whl" ]; then
            echo "::error::Built distributions do not match tag $GITHUB_REF_NAME (expected version $tag_version)."
            echo "::error::This usually means the tag was not available to setuptools-scm during checkout."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hdmimatrix
    permissions:
      # Required for PyPI trusted publishing (OIDC). No API token needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Required to create the release.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to find the previous tag for the compare link.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Build release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ -s notes.md ]; then
            prev_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$prev_tag" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev_tag" "$GITHUB_REF_NAME" >> notes.md
            fi
          else
            echo "::warning::No CHANGELOG.md section found for $version; using generated notes."
          fi
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s notes.md ]; then
            notes_args=(--notes-file notes.md)
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            "${notes_args[@]}"
