[build-system]
# setuptools>=77 is required by the PEP 639 `license` / `license-files` fields below.
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "hdmimatrix"
# Derived from the git tag by setuptools-scm — see [tool.setuptools_scm] below.
dynamic = ["version"]
authors = [
  { name="Mark Lynch", email="marklynch@gmail.com" },
]
description = "Python HDMI Matrix control library for AVGear and possibly other HDMI matrix controllers"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/marklynch/hdmimatrix"
Issues = "https://github.com/marklynch/hdmimatrix/issues"

[tool.setuptools_scm]
# The version comes from the git tag: `v0.7.0` builds as 0.7.0. Builds from an
# untagged commit get a development version derived from the last tag.
# fallback_version applies only when there is no git metadata at all (e.g. an
# unpacked tarball); the release workflow checks the built version against the
# tag, so a release can never silently publish it.
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.coverage.run]
source = ["hdmimatrix"]

[tool.coverage.report]
show_missing = true
fail_under = 80