name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Full lint / type check / test matrix. Nothing is published unless this passes.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag_version pyproject=$project_version"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $project_version"
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hdmimatrix
    permissions:
      # Required for PyPI trusted publishing (OIDC). No API token needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
