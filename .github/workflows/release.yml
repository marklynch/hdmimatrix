name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Full lint / type check / test matrix. Nothing is published unless this passes.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the tag, so it needs the
          # full history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Check built version matches the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          ls -1 dist/
          if [ ! -f "dist/hdmimatrix-${tag_version}.tar.gz" ] || \
             [ ! -f "dist/hdmimatrix-${tag_version}-py3-none-any.whl" ]; then
            echo "::error::Built distributions do not match tag $GITHUB_REF_NAME (expected version $tag_version)."
            echo "::error::This usually means the tag was not available to setuptools-scm during checkout."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hdmimatrix
    permissions:
      # Required for PyPI trusted publishing (OIDC). No API token needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
